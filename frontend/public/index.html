        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Employees First",
          "description": "Employees First gives employers full transparency and control over voluntary benefits — Accident, Hospital Indemnity, and Critical Illness — through an ERISA-compliant financial model that returns excess premium dollars to employee benefits.",
          "url": "https://www.myemployeesfirst.com/",
          "logo": "https://www.myemployeesfirst.com/brand/icon.png",
          "image": "https://www.myemployeesfirst.com/og-image.jpg",
          "founder": {
            "@type": "Person",
            "name": "Amy Hollis",
            "jobTitle": "Founder & Chief Executive Officer",
            "worksFor": {
              "@type": "Organization",
              "name": "Employees First"
            }
          }
        }
        </script>
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Employees First?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Employees First is an ERISA-compliant financial model that creates full transparency, giving employers visibility and control of Accident, Hospital Indemnity, and Critical Illness policies. We make the invisible, visible."
              }
            },
            {
              "@type": "Question",
              "name": "How does the program work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We start by analyzing your current program, which reveals the full picture: exact claims paid, reserves and admin costs, all compensation, and carrier charges. We then identify premium dollars that remain after claims and capped fees, apply our financial model to capture these excess dollars, and they flow back to your benefits program with complete transparency and total employer discretion."
              }
            },
            {
              "@type": "Question",
              "name": "How much can employers save?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most employers see over 25% savings in the first year. We return the dollars to improve employee value. Guaranteed."
              }
            },
            {
              "@type": "Question",
              "name": "Do you sell insurance or administer benefits?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. We don't sell insurance or administer services. Our financial model identifies and captures premium dollars that remain after claims and capped fees — money that would otherwise stay locked inside the carrier."
              }
            },
            {
              "@type": "Question",
              "name": "What can we do with the returned dollars?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You choose. Lower employee costs (medical contributions, Rx costs, etc.), increase benefits for more coverage, add supplemental programs or perks, fund plan expenses without cutting benefit quality, advance your enrollment platform support, or enhance recruitment, retention, and employee well-being. No matter what you choose, the dollars always go back to benefit the employees."
              }
            },
            {
              "@type": "Question",
              "name": "Is there risk to our plan?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Our program mirrors the control of a self-funded plan, but without the risk, and without pooling claims experience with other employers."
              }
            }
          ]
        }
        </script>
